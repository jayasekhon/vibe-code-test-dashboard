<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCHA Funding Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>

<style>
body {font-family:Roboto;margin:0;background:#f5f7fa}
.header {background:#009EDB;color:white;padding:12px 20px;display:flex;justify-content:space-between}
.header img{height:40px}
.container {max-width:1200px;margin:auto;padding:20px}
.card {background:white;padding:15px;margin-bottom:20px;border:1px solid #ddd}
.kpis {display:flex;gap:10px;margin-bottom:20px}
.kpi {flex:1;background:white;padding:10px;border:1px solid #ddd}
.grid {display:grid;grid-template-columns:1fr 1fr;gap:20px}
.full{grid-column:1/span 2}
button {background:#004987;color:white;border:none;padding:8px 12px;cursor:pointer}
</style>
</head>

<body>

<div class="header">
  <div style="display:flex;gap:10px;align-items:center">
    <img src="OCHA-Logo.png">
    <h3>Global Funding Overview 2026</h3>
  </div>
  <div>
    <button onclick="toggleMenu()">Download</button>
    <div id="menu" style="display:none;background:white;position:absolute">
      <a href="2026-06-08.json">Overview</a><br>
      <a href="2026-06-09.json">Flows</a>
    </div>
    <div style="font-size:12px">For Internal Use Only</div>
  </div>
</div>

<div class="container">

<div id="status" class="card">Loading data...</div>

<div id="kpis" class="kpis"></div>

<div class="grid">

<div class="card">
<h4>Top Donors</h4>
<svg id="donorChart" height="250"></svg>
</div>

<div class="card">
<h4>Top Recipients</h4>
<svg id="recipientChart" height="250"></svg>
</div>

<div class="card full">
<h4>Funding Flows (Top 20)</h4>
<svg id="sankeyChart" height="400"></svg>
</div>

<div class="card full">
<h4>Table</h4>
<table id="table"></table>
</div>

</div>
</div>

<script>

function toggleMenu(){
  let m = document.getElementById("menu");
  m.style.display = m.style.display === "none" ? "block" : "none";
}

init();

async function init(){
  try{

    const [overviewRes, flowsRes] = await Promise.all([
      fetch('2026-06-08.json'),
      fetch('2026-06-09.json')
    ]);

    console.log("overview status:", overviewRes.status);
    console.log("flows status:", flowsRes.status);

    const overview = await overviewRes.json();
    const flowsRaw = await flowsRes.json();

    console.log("overview json:", overview);
    console.log("flows json:", flowsRaw);

    const flows = extractArray(flowsRaw);

    console.log("extracted array:", flows);

    const cleaned = transform(flows);

    console.log("cleaned:", cleaned);

    if(cleaned.length === 0){
      showStatus("No usable data found");
      return;
    }

    document.getElementById("status").style.display="none";

    buildKPIs(cleaned);
    buildCharts(cleaned);
    buildSankey(top20(cleaned));
    buildTable(top20(cleaned));

  }catch(err){
    console.error(err);
    showStatus("ERROR LOADING DATA")
  }
}
