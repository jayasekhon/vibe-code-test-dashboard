<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Funding Overview 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>

<style>
:root {
  --primary: #009EDB;
  --dark-blue: #004987;
  --bg: #F5F7FA;
  --text: #1A1A1A;
  --border: #E0E0E0;
  --alert: #D64545;
}

body {
  margin:0;
  font-family: Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.header {
  background: var(--primary);
  color: white;
  padding: 10px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-left {
  display:flex;
  align-items:center;
  gap:12px;
}

.header img {
  height:40px;
}

.container {
  max-width:1200px;
  margin:20px auto;
  padding:0 20px;
}

h1 {
  font-size:24px;
  font-weight:700;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.card {
  background:white;
  padding:15px;
  border:1px solid var(--border);
}

.full {
  grid-column:1 / span 2;
}

.kpis {
  display:flex;
  gap:10px;
}

.kpi {
  flex:1;
  background:white;
  padding:10px;
  border:1px solid var(--border);
}

.footer {
  background:#2C3E50;
  color:white;
  padding:20px;
  font-size:12px;
}

.footer a { color:#ccc; }

@media(max-width:768px) {
  .grid { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="header">
  <div class="header-left">
    <img src="OCHA-Logo.png" alt="OCHA logo">
    <h1>Global Funding Overview 2026</h1>
  </div>
  <div>
    <button onclick="toggleDropdown()">Download Data ▾</button>
    <div id="dropdown" style="display:none; background:white; position:absolute;">
      <a href="#">Overview JSON</a><br>
      <a href="#">Flows JSON</a>
    </div>
    <div style="font-size:11px; text-align:right;">For Internal Use Only</div>
  </div>
</div>

<div class="container">

<div class="kpis" id="kpis"></div>

<div class="grid">

<div class="card">
<h3>Funding by Donor</h3>
<svg id="donorChart"></svg>
</div>

<div class="card">
<h3>Funding by Recipient</h3>
<svg id="recipientChart"></svg>
</div>

<div class="card full">
<h3>Funding Flows (Donor → Recipient → Country)</h3>
<svg id="sankeyChart" height="400"></svg>
</div>

<div class="card full">
<h3>Data Table</h3>
<table id="dataTable"></table>
</div>

</div>

</div>

<div class="footer">
  <div>
    <strong>Feedback and Contact</strong><br>
    Contact: example@un.org
  </div>
  <div>
    <a href="https://www.un.org/en/about-us/terms-of-use">Terms</a> |
    <a href="https://www.un.org/en/about-us/privacy-notice">Privacy</a>
  </div>
  <div>
    Data from multiple sources; may contain limitations.
  </div>
</div>

<script>

console.log("Loading data...");

document.getElementById("kpis").innerHTML = "Loading...";

let rawData = [];
let cleanedData = [];

// Mock data example
rawData = [
 {donor:"USA", recipient:"WFP", country:"Yemen", amount:100},
 {donor:"Germany", recipient:"UNHCR", country:"Sudan", amount:80}
];

cleanedData = rawData;
console.log("Raw:", rawData);
console.log("Cleaned:", cleanedData);

function buildKPIs(data) {
  let total = d3.sum(data, d => d.amount);
  document.getElementById("kpis").innerHTML = `
    <div class="kpi">Total Funding: $${total}</div>
  `;
}

function buildSankey(data) {
  const svg = d3.select("#sankeyChart");

  const sankey = d3.sankey()
    .nodeWidth(15)
    .nodePadding(10)
    .extent([[1,1],[600,300]]);

  const nodes = [];
  const links = [];

  data.forEach(d => {
    nodes.push({name:d.donor});
    nodes.push({name:d.recipient});
    nodes.push({name:d.country});

    links.push({source:d.donor, target:d.recipient, value:d.amount});
    links.push({source:d.recipient, target:d.country, value:d.amount});
  });

  const graph = sankey({nodes:nodes.map(d=>Object.assign({},d)), links});

  svg.selectAll("rect")
    .data(graph.nodes)
    .enter()
    .append("rect")
    .attr("x", d => d.x0)
    .attr("y", d => d.y0)
    .attr("width", d => d.x1-d.x0)
    .attr("height", d => d.y1-d.y0)
    .attr("fill", "#009EDB");

  svg.selectAll("path")
    .data(graph.links)
    .enter()
    .append("path")
